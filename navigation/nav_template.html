<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服务导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:#1a1a2e;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h1{color:#00d4ff;font-size:32px;margin-bottom:36px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:800px}
.card{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:20px 14px 14px;text-align:center;text-decoration:none;color:#e0e0e0;box-shadow:0 4px 20px rgba(0,0,0,.3);transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column;align-items:center;min-height:166px}
.card:hover{transform:translateY(-4px);border-color:#00d4ff;box-shadow:0 8px 30px rgba(0,212,255,.15)}
.icon{width:82px;height:82px;margin:0 auto 0px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:34px;color:#fff;font-weight:700}
.title{font-size:18px;font-weight:600;color:#00d4ff;margin-bottom:0;position:relative;top:11px}
.desc{font-size:11px;color:#a0a0b0;margin-top:0;padding-bottom:2px;position:relative;top:11px}
.card.empty{opacity:.35;pointer-events:none}
.card.empty .icon{background:#0f3460!important}
.card.empty .title{color:#555}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<h1>服务导航</h1>
<div class="grid">
<!--GRID_PLACEHOLDER-->
</div>
</body>
</html>
